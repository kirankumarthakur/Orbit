services:
  postgres:
    image: postgres:16
    container_name: orbit_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: orbit_user
      POSTGRES_PASSWORD: orbit_password
      POSTGRES_DB: orbit_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
